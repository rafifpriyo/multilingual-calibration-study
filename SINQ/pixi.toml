[workspace]
channels = ["conda-forge"]
name = "multilingual-calibration-study"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "<=3.12.11"
numpy = "==1.26.4"
fsspec = "==2025.3.0"

[pypi-dependencies]
python-dotenv = "==1.1.1"
pandas = "<=2.2.2"
transformers = ">=5.2.0"
huggingface_hub = ">=0.22"
einops = ">=0.8.1"
safetensors = ">=0.4.2"
hf_transfer = ">=0.1.9"
datasets = "==3.6.0"
scipy = ">=1.13.1"

torch = ">=2.1"
torchaudio = ">=2.8.0"
torchvision = ">=0.23.0"
lm_eval = ">=0.4.11"
termcolor = "==3.3.0"
gemlite = "==0.5.1.post1"

protobuf = "==5.29.3"
lm-eval = ">=0.4.9.1"
wandb = "<=0.22.1"


[feature.gpu.system-requirements]
cuda = "12.8"

[feature.gpu.pypi-options]
dependency-overrides = { numpy = "==1.26.4" }

[feature.gpu.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cu128"}
torchvision = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cu128" }

[feature.cpu.pypi-dependencies]
torch = { version = "==2.8.0", index = "https://download.pytorch.org/whl/cpu"}
torchvision = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cpu" }

[feature.cpu.pypi-options]
dependency-overrides = { numpy = "==1.26.4" }

[environments]
cpu = ["cpu"]
gpu = ["gpu"]
default = ["gpu"]
